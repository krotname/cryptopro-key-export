name: build

# Постоянный сборщик — домашний Ubuntu Xeon (self-hosted раннер adler-ubuntu-xeon).
# Linux компилирует весь проект, включая WinForms (EnableWindowsTargeting), и публикует
# портативный self-contained exe (win-x86). Это и есть основной CI-гейт: сборка без
# предупреждений и успешная публикация под все RID.
#
# Рантайм-проверки (юнит-тесты, --selftest, запуск exe, отчёт deps, руководство, коды CLI)
# требуют Windows: WinForms-exe на Linux не запускается, а 12 из 302 тестов дёргают cmd.exe
# и системные пути (на Linux проходит 290, падают ровно эти платформенные). Поэтому они
# вынесены в job `windows-tests`, который идёт только когда переменная репозитория
# CI_RUNS_ON_WINDOWS указывает на доступный Windows-раннер; иначе пропускается и PR не
# блокирует. Полный набор разработчик гоняет локально на Windows перед коммитом
# (AGENTS.md: обязательный минимум).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  PORTABLE_RID: win-x86

jobs:
  build:
    name: Сборка и портативный exe (Linux)
    # По умолчанию — постоянный домашний Ubuntu Xeon. Переменная репозитория CI_RUNS_ON
    # переводит Linux-job'ы на другой раннер, если этот недоступен: например ["ubuntu-latest"].
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","adler-ubuntu-xeon"]') }}
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.portable.outputs.sha256 }}
      version: ${{ steps.portable.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      # .NET SDK 10 предустановлен на раннере (adler-ubuntu-xeon) системно —
      # actions/setup-dotnet здесь не нужен и на self-hosted раннере только мешает.

      - name: Версия .NET
        run: dotnet --version

      - name: Сборка всего решения (предупреждения = ошибки)
        run: dotnet build CryptoProExport.slnx -c Release -warnaserror

      # Портативная сборка тем же вызовом, что build/publish.ps1, но без --selftest:
      # запуск WinForms-exe возможен только на Windows (см. job windows-tests).
      - name: Портативная сборка (self-contained ${{ env.PORTABLE_RID }})
        run: >
          dotnet publish src/App/CryptoProExport.App.csproj -c Release
          -r ${{ env.PORTABLE_RID }} --self-contained true -p:DebugType=embedded
          -o publish

      - name: Проверить «ровно один exe» и посчитать контрольную сумму
        id: portable
        run: |
          set -euo pipefail
          ls -1 publish
          count=$(find publish -maxdepth 1 -type f | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "Ожидался один файл в publish, а их $count" >&2
            exit 1
          fi
          hash=$(sha256sum publish/CryptoProExport.exe | cut -d' ' -f1)
          version=$(dotnet msbuild src/App/CryptoProExport.App.csproj -nologo -getProperty:Version)
          echo "SHA-256: $hash"
          echo "Версия:  $version"
          printf '%s *CryptoProExport.exe\n' "$hash" > publish/CryptoProExport.exe.sha256
          echo "sha256=$hash"     >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Выложить портативный exe
        uses: actions/upload-artifact@v4
        with:
          name: CryptoProExport-portable-${{ env.PORTABLE_RID }}
          path: |
            publish/CryptoProExport.exe
            publish/CryptoProExport.exe.sha256
          retention-days: 30

  # Другие архитектуры собираем, чтобы ловить регрессии компиляции.
  # Портативной сборкой остаётся x86 — только в ней работает вшитый rtCOMLite.
  architectures:
    name: Сборка под ${{ matrix.rid }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","adler-ubuntu-xeon"]') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - uses: actions/checkout@v4
      # .NET SDK 10 предустановлен на раннере — setup-dotnet не нужен (см. job build).
      - name: Публикация ${{ matrix.rid }}
        run: >
          dotnet publish src/App/CryptoProExport.App.csproj -c Release
          -r ${{ matrix.rid }} --self-contained true -p:DebugType=embedded
          -o out-${{ matrix.rid }}
      - name: Итог
        run: |
          f="out-${{ matrix.rid }}/CryptoProExport.exe"
          printf '%s: %s\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"

  # Рантайм-проверки на Windows: юнит-тесты (302), портативная сборка с --selftest,
  # отчёт deps, встроенное руководство, локализация вывода и коды возврата CLI.
  # Идёт только при заданной переменной CI_RUNS_ON_WINDOWS (напр. ["windows-latest"]
  # или собственный Windows-раннер). Без неё job пропускается и не блокирует PR:
  # постоянный сборщик — Linux, а Windows-раннер может быть офлайн.
  windows-tests:
    name: Тесты и самопроверка (Windows)
    if: ${{ vars.CI_RUNS_ON_WINDOWS != '' }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_WINDOWS || '["self-hosted","windows","adler-white-1w","cryptopro"]') }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Установить .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Сборка (предупреждения = ошибки)
        run: dotnet build CryptoProExport.slnx -c Release -warnaserror

      - name: Юнит-тесты
        run: dotnet test CryptoProExport.slnx -c Release --no-build --logger "console;verbosity=normal"

      # Самопроверка гоняется на портативной сборке: рантайм .NET внутри неё.
      # Обычный build даёт framework-dependent x86, а 32-битного рантайма на раннере нет.
      - name: Портативная сборка + самопроверка GUI
        run: pwsh build/publish.ps1 -Rid ${{ env.PORTABLE_RID }}

      - name: Проверить отчёт о зависимостях
        shell: pwsh
        run: |
          # Раннеры бывают обоих видов: на GitHub-hosted КриптоПро нет, на
          # собственном adler-white-1w он стоит. Контракт deps разный (0 — CSP
          # найден, 2 — нет), поэтому факт выясняем независимо от самой
          # программы — по регистрации CryptoAPI-провайдеров. Смотрим оба вида
          # реестра: exe 32-битный и читает ветку WOW6432Node.
          $keys = @(
            'HKLM:\SOFTWARE\Microsoft\Cryptography\Defaults\Provider',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Cryptography\Defaults\Provider'
          )
          $providers = @(
            $keys | ForEach-Object { Get-ChildItem $_ -ErrorAction SilentlyContinue } |
              Where-Object { $_.PSChildName -match 'Crypto-Pro' }
          ).Count
          $want = if ($providers -gt 0) { 0 } else { 2 }
          "Провайдеров Crypto-Pro в реестре: $providers, ждём код $want"

          # Язык задаём явно: маркеры ниже русские, а культура раннера разная.
          $log = "$env:RUNNER_TEMP/deps.txt"
          $p = Start-Process publish/CryptoProExport.exe 'deps --lang ru' -Wait -PassThru -WindowStyle Hidden -RedirectStandardOutput $log
          $text = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($log))
          $text
          if ($p.ExitCode -ne $want) { throw "Ожидался код $want, получен $($p.ExitCode)" }

          # Отчёт обязан сходиться с кодом, иначе «CSP НЕ НАЙДЕН» и нулевой код
          # прошли бы вместе. Сверяем по строке про сам CSP, а не по именам
          # провайдеров: подробный отчёт перечисляет все три известных провайдера
          # в любом случае, помечая каждый «есть»/«нет». Имён контейнеров с ФИО
          # в deps нет вообще — в лог CI попадать нечему.
          $marker = if ($providers -gt 0) { 'КриптоПро CSP: установлен' } else { 'НЕ НАЙДЕН' }
          if ($text -notmatch [regex]::Escape($marker)) { throw "В отчёте нет строки «$marker»" }

      - name: Проверить встроенное руководство
        shell: pwsh
        run: |
          # Язык вывода зависит от культуры машины, поэтому задаём его явно:
          # на англоязычном раннере поиск русского маркера иначе бы упал.
          $cases = @(
            @{ lang = 'ru'; marker = 'КОМАНДНАЯ СТРОКА' },
            @{ lang = 'en'; marker = 'COMMAND LINE' },
            @{ lang = 'ja'; marker = 'COMMAND LINE' }   # перевода руководства нет — откат на en
          )
          foreach ($c in $cases) {
            $log = "$env:RUNNER_TEMP/help-$($c.lang).txt"
            $p = Start-Process publish/CryptoProExport.exe "help --lang $($c.lang)" -Wait -PassThru `
                               -WindowStyle Hidden -RedirectStandardOutput $log
            $text = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($log))
            "--lang $($c.lang): строк $(($text -split "`n").Count)"
            if ($p.ExitCode -ne 0) { throw "help --lang $($c.lang) вернул $($p.ExitCode)" }
            if ($text -notmatch $c.marker) { throw "в руководстве ($($c.lang)) нет маркера $($c.marker)" }
          }

      - name: Проверить локализацию консольного вывода
        shell: pwsh
        run: |
          # Свои строки переведены на 20 языков; здесь проверяем, что --lang доходит
          # до вывода и что неизвестный язык — это внятная ошибка, а не молчание.
          $log = "$env:RUNNER_TEMP/usage-tr.txt"
          Start-Process publish/CryptoProExport.exe 'чепуха --lang tr' -Wait -WindowStyle Hidden `
                        -RedirectStandardOutput $log | Out-Null
          $text = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($log))
          $text
          if ($text -notmatch 'kapsayıcı') { throw "подсказка по командам не переведена на tr" }

          $err = "$env:RUNNER_TEMP/lang-err.txt"
          $p = Start-Process publish/CryptoProExport.exe '--lang zz help' -Wait -PassThru -WindowStyle Hidden `
                            -RedirectStandardOutput "$env:RUNNER_TEMP/lang-out.txt" -RedirectStandardError $err
          $message = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($err))
          $message
          if ($p.ExitCode -ne 1) { throw "неизвестный --lang должен давать код 1, получен $($p.ExitCode)" }
          if ($message -notmatch 'zh-Hans') { throw "в сообщении об ошибке нет списка доступных языков" }

      - name: Проверить коды возврата CLI
        shell: pwsh
        run: |
          # Контракт: 0 — успех, 1 — неверные аргументы, 2 — не выполнено по существу,
          # 3 — ошибка выполнения. Ломать его нельзя: на коды опираются скрипты.
          $cases = @(
            @{ args = 'help';                          want = 0 },
            @{ args = 'installed';                     want = 0 },
            @{ args = 'checkexport НетТакогоКонтейнера'; want = 2 },
            @{ args = 'install нет-такой-папки';        want = 3 },
            @{ args = 'чепуха';                         want = 1 }
          )
          $bad = @()
          foreach ($c in $cases) {
            $p = Start-Process publish/CryptoProExport.exe $c.args -Wait -PassThru -WindowStyle Hidden `
                                -RedirectStandardOutput "$env:RUNNER_TEMP/cli.txt" -RedirectStandardError "$env:RUNNER_TEMP/cli-err.txt"
            "{0,-34} код={1} (ждали {2})" -f $c.args, $p.ExitCode, $c.want
            if ($p.ExitCode -ne $c.want) { $bad += "$($c.args): $($p.ExitCode) вместо $($c.want)" }
          }
          if ($bad) { throw "Коды возврата разошлись с контрактом: $($bad -join '; ')" }

  release:
    name: Релиз по тегу
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    # Релиз собирает тот же постоянный Linux-раннер. CI_RUNS_ON переводит его на другой,
    # если этот недоступен: например ["ubuntu-latest"].
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","adler-ubuntu-xeon"]') }}
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CryptoProExport-portable-win-x86
          path: dist

      # Публикуем через REST API, а не через gh CLI: на собственном раннере gh не
      # установлен, и job падал на каждом теге с «gh: command not found» (релиз v1.3.1
      # выкладывали руками из артефакта). curl и coreutils есть в любом окружении,
      # поэтому шаг больше не зависит от того, что предустановлено на раннере.
      - name: Создать релиз
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          name="CryptoProExport-$VERSION-portable-x86.exe"
          cd dist
          mv CryptoProExport.exe "$name"
          rm -f CryptoProExport.exe.sha256

          # Контрольную сумму пересчитываем под итоговое имя файла: иначе её нечем проверить.
          # Заодно сверяем с суммой из сборки — так ловится порча артефакта между job.
          sha256sum "$name" > "$name.sha256"
          actual=$(cut -d' ' -f1 < "$name.sha256")
          if [ "$actual" != "$SHA256" ]; then
            echo "Сумма разошлась: собрано $SHA256, в артефакте $actual" >&2
            exit 1
          fi
          cd ..

          api_version='X-GitHub-Api-Version: 2022-11-28'

          # JSON собираем без jq (его на раннере тоже может не быть). Текст заметок
          # свой и постоянный: кавычек и обратных слэшей в нём нет, переводы строк
          # записаны сразу escape-последовательностью \n — printf их не разворачивает,
          # потому что подставляет тело через %s, а не в строку формата.
          body='Портативная сборка: один exe, внутри .NET, p12utility, rtCOMLite и руководство.\n\nРаботает на x86, x64 и ARM64. Снаружи нужен только КриптоПро CSP.\n\nSHA-256: `'"$SHA256"'`'
          printf '{"tag_name":"%s","name":"CryptoPro Key Export %s","body":"%s"}' \
            "$GITHUB_REF_NAME" "$GITHUB_REF_NAME" "$body" > release.json

          code=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H "$api_version" \
            -H 'Content-Type: application/json' \
            --data-binary @release.json)
          if [ "$code" != '201' ]; then
            echo "Создание релиза: HTTP $code" >&2
            cat response.json >&2
            exit 1
          fi

          # upload_url приходит URI-шаблоном «…/assets{?name,label}» — отбрасываем хвост.
          # Берём именно его, а не собираем ссылку из id: порядок полей в ответе
          # не гарантирован, а имя upload_url уникально. `|| true` обязателен: при
          # pipefail и set -e пустой grep убил бы шаг молча, без внятного сообщения.
          upload=$(grep -o '"upload_url":[[:space:]]*"[^"]*"' response.json | head -1 | cut -d'"' -f4 || true)
          upload=${upload%%\{*}
          if [ -z "$upload" ]; then
            echo 'В ответе нет upload_url' >&2
            cat response.json >&2
            exit 1
          fi

          for file in "$name" "$name.sha256"; do
            case "$file" in
              *.exe) type='application/octet-stream' ;;
              *)     type='text/plain' ;;
            esac
            code=$(curl -sS -o asset.json -w '%{http_code}' -X POST \
              "$upload?name=$file" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H "$api_version" \
              -H "Content-Type: $type" \
              --data-binary @"dist/$file")
            if [ "$code" != '201' ]; then
              echo "Загрузка $file: HTTP $code" >&2
              cat asset.json >&2
              exit 1
            fi
            echo "Загружен $file"
          done
