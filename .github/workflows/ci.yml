name: build

# Сборка идёт только на Windows: проект — WinForms + CryptoAPI (net10.0-windows).
# Результат — один портативный exe (win-x86), внутри которого всё: .NET, p12utility,
# rtCOMLite и руководство. x86 выбран как универсальный: идёт и на x64 (WOW64),
# и на ARM64 (эмуляция), а вшитый 32-битный rtCOMLite грузится только в такой процесс.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  PORTABLE_RID: win-x86

jobs:
  build:
    name: Сборка, тесты, портативный exe
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.portable.outputs.sha256 }}
      version: ${{ steps.portable.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Установить .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Сборка (предупреждения = ошибки)
        run: dotnet build CryptoProExport.slnx -c Release -warnaserror

      - name: Юнит-тесты
        run: dotnet test CryptoProExport.slnx -c Release --no-build --logger "console;verbosity=normal"

      # Самопроверка гоняется на портативной сборке: рантайм .NET внутри неё.
      # Обычный build даёт framework-dependent x86, а 32-битного рантайма на раннере нет.
      - name: Портативная сборка + самопроверка GUI
        run: pwsh build/publish.ps1 -Rid ${{ env.PORTABLE_RID }}

      - name: Проверить, что exe ровно один, и посчитать контрольную сумму
        id: portable
        shell: pwsh
        run: |
          $files = Get-ChildItem publish -File
          $files | ForEach-Object { "{0} ({1:N1} МБ)" -f $_.Name, ($_.Length / 1MB) }
          if ($files.Count -ne 1) { throw "Ожидался один файл, а их $($files.Count)" }

          $exe = Join-Path (Resolve-Path publish) 'CryptoProExport.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe).FileVersion
          "SHA-256: $hash"
          "Версия:  $version"
          "$hash *CryptoProExport.exe" | Set-Content publish/CryptoProExport.exe.sha256 -Encoding ascii
          "sha256=$hash"     >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Проверить работу без КриптоПро CSP
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP/deps.txt"
          $p = Start-Process publish/CryptoProExport.exe 'deps' -Wait -PassThru -WindowStyle Hidden -RedirectStandardOutput $log
          [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($log))
          # На раннере КриптоПро нет — ждём код 2 и отчёт про недостающий CSP
          if ($p.ExitCode -ne 2) { throw "Ожидался код 2 (нет КриптоПро CSP), получен $($p.ExitCode)" }

      - name: Проверить встроенное руководство
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP/help.txt"
          $p = Start-Process publish/CryptoProExport.exe 'help' -Wait -PassThru -WindowStyle Hidden -RedirectStandardOutput $log
          $text = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($log))
          "строк в руководстве: $(($text -split "`n").Count)"
          if ($p.ExitCode -ne 0) { throw "help вернул $($p.ExitCode)" }
          if ($text -notmatch 'КОМАНДНАЯ СТРОКА') { throw "руководство не вшито в exe" }

      - name: Выложить портативный exe
        uses: actions/upload-artifact@v4
        with:
          name: CryptoProExport-portable-${{ env.PORTABLE_RID }}
          path: |
            publish/CryptoProExport.exe
            publish/CryptoProExport.exe.sha256
          retention-days: 30

  # Другие архитектуры собираем, чтобы ловить регрессии компиляции.
  # Портативной сборкой остаётся x86 — только в ней работает вшитый rtCOMLite.
  architectures:
    name: Сборка под ${{ matrix.rid }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Публикация ${{ matrix.rid }}
        run: >
          dotnet publish src/App/CryptoProExport.App.csproj -c Release
          -r ${{ matrix.rid }} --self-contained true -p:DebugType=embedded
          -o out-${{ matrix.rid }}
      - name: Итог
        shell: pwsh
        run: |
          $exe = Get-Item "out-${{ matrix.rid }}/CryptoProExport.exe"
          "{0}: {1:N1} МБ" -f $exe.Name, ($exe.Length / 1MB)

  release:
    name: Релиз по тегу
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CryptoProExport-portable-win-x86
          path: dist

      - name: Создать релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          asset="dist/CryptoProExport-$VERSION-portable-x86.exe"
          mv dist/CryptoProExport.exe "$asset"
          printf '%s\n\n%s\n\n%s\n' \
            'Портативная сборка: один exe, внутри .NET, p12utility, rtCOMLite и руководство.' \
            'Работает на x86, x64 и ARM64. Снаружи нужен только КриптоПро CSP.' \
            "SHA-256: \`$SHA256\`" > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "CryptoPro Key Export $GITHUB_REF_NAME" \
            --notes-file notes.md \
            "$asset" dist/CryptoProExport.exe.sha256
